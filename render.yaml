# Render Blueprint: provisions a Postgres database and a single Node web service
# that serves both the Express API (under /api) and the built React app.
#
# To deploy:
#   1. Push this branch to GitHub
#   2. Go to https://dashboard.render.com/blueprints and click "New Blueprint Instance"
#   3. Select this repo, click Apply, and Render does the rest
#
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: food-booking-db
    plan: free
    region: oregon
    databaseName: food_booking
    postgresMajorVersion: "16"

services:
  - type: web
    name: food-booking
    runtime: node
    plan: free
    region: oregon
    branch: replit-export
    # Activate pnpm via corepack, install workspace deps, build API + frontend.
    # The DB schema push + seed run at startup time (free tier doesn't support
    # preDeployCommand) inside scripts/start.sh.
    buildCommand: |
      set -e
      corepack enable
      corepack prepare pnpm@10 --activate
      pnpm install --no-frozen-lockfile
      # Build API server and frontend directly. We deliberately skip the
      # workspace-level "build" script because it gates everything behind
      # `pnpm run typecheck`, which we don't need at deploy time and which
      # adds noise to deploy failures.
      pnpm --filter @workspace/api-server run build
      pnpm --filter @workspace/food-booking run build
      # Fail fast if the artifact we expect to start isn't there.
      test -f artifacts/api-server/dist/index.mjs
      test -f artifacts/food-booking/dist/public/index.html
      ls -la artifacts/api-server/dist/
      ls -la artifacts/food-booking/dist/public/
    startCommand: bash ./scripts/start.sh
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: food-booking-db
          property: connectionString
      # WhatsApp + TextMeBot credentials — set these in the Render dashboard
      # after the service is created. Leaving them unset just disables WhatsApp
      # notifications; the rest of the app works fine.
      - key: WHATSAPP_NUMBER
        sync: false
      - key: TEXTMEBOT_API_KEY
        sync: false
